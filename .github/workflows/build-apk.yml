name: Build Dish TV Remote APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Prepare Gradle Wrapper
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Verify Gradle
        run: ./gradlew --version

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon --rerun-tasks

      - name: Verify APK was produced
        run: |
          echo "=== Searching for .apk files ==="
          APK_COUNT=$(find "$GITHUB_WORKSPACE" -name "*.apk" -type f 2>/dev/null | wc -l)
          find "$GITHUB_WORKSPACE" -name "*.apk" -type f 2>/dev/null \
            | while read f; do echo "  FOUND: $f ($(du -h "$f" | cut -f1))"; done
          echo "=== Total APKs found: $APK_COUNT ==="
          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: assembleDebug completed but no .apk file was produced!"
            echo "Listing app/build/ directory tree for diagnosis:"
            find "$GITHUB_WORKSPACE/app/build" -type f 2>/dev/null | head -50 || echo "(app/build does not exist)"
            exit 1
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DishTvRemote-Debug-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          retention-days: 30
